<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>School Market</title>
</head>
<body>

<h2>School Market</h2>

<!-- 로그인 -->
<div id="auth">
  <input id="email" placeholder="이메일"><br>
  <input id="password" type="password" placeholder="비밀번호"><br>
  <button onclick="signUp()">회원가입</button>
  <button onclick="login()">로그인</button>
</div>

<!-- 앱 -->
<div id="app" style="display:none;">

  <button onclick="logout()">로그아웃</button>

  <hr>

  <!-- 탭 -->
  <button onclick="showTab('list')">상품 목록</button>
  <button onclick="showTab('add')">상품 등록</button>

  <hr>

  <!-- 상품 목록 -->
  <div id="listTab">
    <h3>상품 목록</h3>
    <div id="items"></div>
  </div>

  <!-- 상품 등록 -->
  <div id="addTab" style="display:none;">
    <h3>상품 등록</h3>
    <input id="title" placeholder="상품명"><br>
    <input id="price" placeholder="가격"><br>
    <input type="file" id="image"><br>
    <button onclick="addItemWithImage()">등록</button>
  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
